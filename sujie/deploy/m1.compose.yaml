name: sujie-m1

services:
  receiver:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.receiver
      args:
        SUJIE_PYTHON_BASE: "${SUJIE_PYTHON_BASE:-python:3.12-slim}"
    command: ["python", "/app/receiver_service.py"]
    expose: ["8080"]
    networks: [tool-net]
    read_only: true
    user: "65532:65532"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 32
    mem_limit: 128m
    init: true
    restart: "no"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)",
        ]
      interval: 2s
      timeout: 3s
      retries: 20

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
      args:
        SUJIE_PYTHON_BASE: "${SUJIE_PYTHON_BASE:-python:3.12-slim}"
        SUJIE_OFFLINE_BUILD: "${SUJIE_OFFLINE_BUILD:-0}"
    environment:
      SUJIE_EVIDENCE_ROOT: /runtime/evidence
      SUJIE_WORKSPACE_ROOT: /runtime/workspace
      SUJIE_RECEIVER_URL: http://receiver:8080/upload
      SUJIE_TRACE_DB: /runtime/trace.sqlite3
      SUJIE_SYNTHETIC_FIXTURE_MODE: "1"
    expose: ["8000"]
    networks: [agent-net, tool-net]
    read_only: true
    user: "65532:65532"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 96
    mem_limit: 768m
    tmpfs:
      - /runtime:rw,nosuid,nodev,noexec,uid=65532,gid=65532,mode=0700
      - /tmp:rw,nosuid,nodev,noexec,uid=65532,gid=65532,mode=0700
    init: true
    restart: "no"
    depends_on:
      receiver:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  agent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.agent
      args:
        SUJIE_PYTHON_BASE: "${SUJIE_PYTHON_BASE:-python:3.12-slim}"
        SUJIE_OFFLINE_BUILD: "${SUJIE_OFFLINE_BUILD:-0}"
    environment:
      SUJIE_GATEWAY_URL: http://gateway:8000
    networks: [agent-net]
    read_only: true
    user: "65532:65532"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 512m
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,uid=65532,gid=65532,mode=0700
    init: true
    restart: "no"
    depends_on:
      gateway:
        condition: service_healthy

  oracle:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.receiver
      args:
        SUJIE_PYTHON_BASE: "${SUJIE_PYTHON_BASE:-python:3.12-slim}"
    command: ["python", "/app/container_oracle.py"]
    networks: [tool-net]
    read_only: true
    user: "65532:65532"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 16
    mem_limit: 64m
    init: true
    restart: "no"
    depends_on:
      gateway:
        condition: service_healthy
      receiver:
        condition: service_healthy

networks:
  agent-net:
    internal: true
  tool-net:
    internal: true
